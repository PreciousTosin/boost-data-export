[project]
name = "data-export"
version = "0.1.0"
description = "A small data export module: multi-format output (CSV/JSON) with TTL caching."
readme = "README.md"
requires-python = ">=3.12"
# No runtime dependencies: the core module uses only the standard library,
# which keeps it trivially runnable and easy to review.
dependencies = []

[dependency-groups]
# Installed automatically by `uv sync` / `uv run` (uv includes the "dev" group by default).
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
# The sample dataset is provided by Boost; don't lint it.
extend-exclude = ["examples/data.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "A", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
